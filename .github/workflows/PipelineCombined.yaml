name: Daily NSE Weekly + Daily Combined Quant Scan
on:
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run NSE Weekly + Daily Combined Quant Scan
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python main_combined.py
      - name: Upload results CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-combined-quant-results-${{ github.run_number }}
          path: |
            nse_setups_weekly_results_*.csv
            nse_setups_daily_results_*.csv
            nse_setups_combined_results_*.csv
          retention-days: 30
          if-no-files-found: warn
